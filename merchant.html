<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merchant Embed - Checkout Test</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="embed.css">
</head>
<body>
  <nav><a href="index.html">Checkout</a><a href="customer.html">Customer embed</a><a class="active" href="merchant.html">Merchant embed</a></nav>
  <div id="panel"><p id="status">Loading...</p><div id="error"></div></div>
  <iframe id="embedFrame" title="Merchant Embed" allow="clipboard-write; clipboard-read"></iframe>
  <script src="embed-common.js"></script>
  <script>
    const panel = document.getElementById("panel");
    const frame = document.getElementById("embedFrame");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    function fail(message) { statusEl.textContent = ""; errorEl.innerHTML = message; }

    (async () => {
      const session = loadSession();
      const id = new URLSearchParams(location.search).get("session") || session?.checkoutSessionId;
      if (!id) return fail('No transaction yet. Create one on the <a href="index.html">Checkout</a> page first.');
      try {
        // The embed link is single-use and short-lived, so mint a fresh one on every load.
        const result = await postJson("/checkout/merchantEmbedUrl", { checkoutSessionId: String(id) });
        openInFrame(panel, frame, result.data.embedUrl);
      } catch (e) {
        fail(e instanceof Error ? e.message : "Unable to open the merchant page");
      }
    })();
  </script>
</body>
</html>
