<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Quicksand', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #f5f5f6;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 380px;
    width: 100%;
    margin: 24px;
    padding: 40px 32px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .brand img { height: 24px; }
  .brand span { font-weight: 700; font-size: 18px; color: #111; }
  .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #16a34a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 32px; height: 32px; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #111;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #767676;
    margin: 0;
  }
</style>
