<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout Test</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 0; }
  #formWrap { max-width: 480px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-size: 14px; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
  #error { color: red; margin-top: 12px; }
  #checkoutFrame { display: none; width: 100vw; height: 100vh; border: none; }
</style>
</head>
<body>
  <div id="formWrap">
    <h2>Checkout Test</h2>

    <form id="checkoutForm">
      <label>Customer Email
        <input type="email" id="email" required>
      </label>
      <label>Customer Name
        <input type="text" id="name" required>
      </label>
      <label>Amount
        <input type="number" id="amount" min="0" step="0.01" required>
      </label>
      <button type="submit">Pay</button>
    </form>

    <div id="error"></div>
  </div>

  <iframe id="checkoutFrame"></iframe>

  <script>
    const API_BASE_URL = "https://checkout-be-jxj8.onrender.com/";
    // const API_BASE_URL = "http://localhost:4000";

    document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const errorEl = document.getElementById("error");
      const frameEl = document.getElementById("checkoutFrame");
      errorEl.textContent = "";

      const email = document.getElementById("email").value;
      const name = document.getElementById("name").value;
      const amount = document.getElementById("amount").value;

      const payload = {
        amount: Number(amount),
        currency: "NGN",
        customerRef: email,
        customerName: name,
        description: "Test checkout",
        merchantOrderRef: `order-${Date.now()}`,
      };

      try {
        const response = await fetch(`${API_BASE_URL}/checkout/createCheckout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Checkout request failed");
        }

        const checkoutUrl = result?.data?.checkoutUrl;
        if (!checkoutUrl) {
          throw new Error("No checkout URL found in response: " + JSON.stringify(result));
        }

        document.getElementById("formWrap").style.display = "none";
        frameEl.src = checkoutUrl;
        frameEl.style.display = "block";
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
